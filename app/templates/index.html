<!DOCTYPE html>
<html>
<head>
    <title>image2plug Upload</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        body{font-family:Arial, sans-serif; margin:40px;}
        .container{max-width:600px;margin:auto;}
        label{display:block;margin-top:15px;}
    </style>
</head>
<body>
<div class="container">
    <h1>Upload Image</h1>
    <form action="/upload" method="post" enctype="multipart/form-data">
        <label>Image: <input type="file" name="file" required></label>
        <label><input type="checkbox" name="smooth"> Smooth</label>
        <label><input type="checkbox" name="measure_error"> Measure Error</label>
        <label>Border Mode:
            <select name="border_mode">
                <option value="tight">tight</option>
                <option value="inside">inside</option>
                <option value="outside">outside</option>
            </select>
        </label>
        <button type="submit">Submit</button>
    </form>
</div>
</body>
</html>
