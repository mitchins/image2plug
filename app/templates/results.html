<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Job {{ job_id }} Results</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        body { font-family: Arial, sans-serif; margin: 2rem; }
        img { max-width: 100%; height: auto; }
        .container { max-width: 800px; margin: auto; }
    </style>
</head>
<body>
<div class="container">
    <h1>Job {{ job_id }}</h1>
    <h2>Input Image</h2>
    <img src="/static/{{ job_id }}/{{ input_image }}" alt="input">
    <h2>Results</h2>
    <pre>{{ result | tojson(indent=2) }}</pre>
    <p><a href="/static/{{ job_id }}/candidates" download>Download Candidates</a></p>
</div>
</body>
</html>
